[project]
name = "kaspersky-python"
version = "0.1.0"
description = "Тестовое задание на позицию Python Developer"
readme = "README.md"
authors = [
    { name = "Егор Липилин", email = "egorlcrab@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ijson>=3.6.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
main = "kaspersky_python.main:main"
migrate = "kaspersky_python.migrate:migrate"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
